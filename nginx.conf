worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log    off;
    error_log     /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # serve the .gz files made at build time, gzip below only covers anything without one
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # only send "Connection: upgrade" for websocket requests
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # server block is rendered from jams.conf.template at container start
    include /etc/nginx/conf.d/jams.conf;
}
